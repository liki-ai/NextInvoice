# /etc/nginx/sites-available/api.mynextinvoice.com
# certbot adds the HTTPS listener and the redirect: certbot --nginx -d api.mynextinvoice.com
server {
    listen 80;
    listen [::]:80;
    server_name api.mynextinvoice.com;

    # Invoice photos, payment proof and logos travel as base64 inside JSON.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI extraction of a photographed invoice can take a while.
        proxy_read_timeout 120s;
    }
}
